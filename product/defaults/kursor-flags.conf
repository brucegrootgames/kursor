# Extra Chromium/Electron flags for Kursor — one flag per line, '#' starts a comment.
# Read by ~/.local/bin/kursor on every launch (seeded by product/install.sh, never overwritten).
#
# Under a Wayland session the launcher already adds
#   --ozone-platform=wayland --enable-wayland-ime
# unless a line here sets --ozone-platform yourself.
#
# Examples:
# --ozone-platform=x11                  # run through XWayland instead
# --disable-gpu                         # troubleshoot rendering glitches
# --password-store=basic                # no keyring available (overrides argv.json)
# --force-device-scale-factor=1.25
