<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Kursor mark: a text cursor (violet bar) and a code bracket forming a K -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e2a"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#7c8cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f9bff"/>
      <stop offset="1" stop-color="#b57cff"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#tile)"/>
  <rect width="256" height="256" rx="58" fill="url(#glow)"/>
  <rect x="78" y="62" width="24" height="132" rx="10" fill="#9b8cff" opacity="0.55" filter="url(#soft)"/>
  <rect x="78" y="62" width="24" height="132" rx="10" fill="url(#bar)"/>
  <polyline points="176,70 110,128 176,186" fill="none" stroke="#eef0f6" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
